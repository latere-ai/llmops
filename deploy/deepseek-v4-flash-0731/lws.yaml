# DeepSeek-V4-Flash-0731 on one 8x B200 node (specs/017, specs/008).
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: deepseek-v4-flash-0731
  namespace: llmops
  labels:
    app.kubernetes.io/name: deepseek-v4-flash-0731
    app.kubernetes.io/part-of: llmops
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 1
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: deepseek-v4-flash-0731
      spec:
        nodeSelector:
          latere.ai/gpu-pool: b200
        containers:
          - name: runtime
            image: ghcr.io/latere-ai/llmops-runtime-sglang:v0.1.0
            args: ["serve", "--manifest", "/etc/llmops/model.yaml"]
            ports:
              - containerPort: 8000
                name: http
            readinessProbe:
              httpGet: { path: /ready, port: 8000 }
              periodSeconds: 10
              # Cold start adds 10-15 min on top of the weight fetch
              # while FlashInfer autotunes and SGLang captures the draft
              # and verify CUDA graphs; later starts reuse the cache.
              failureThreshold: 240
            livenessProbe:
              httpGet: { path: /healthz, port: 8000 }
              periodSeconds: 30
            resources:
              limits:
                nvidia.com/gpu: "8"
            volumeMounts:
              - { name: model-manifest, mountPath: /etc/llmops }
              - { name: cache, mountPath: /cache }
              - { name: shm, mountPath: /dev/shm }
        volumes:
          - name: model-manifest
            configMap: { name: deepseek-v4-flash-0731-manifest }
          - name: cache
            hostPath: { path: /var/cache/llmops, type: DirectoryOrCreate }
          - name: shm
            emptyDir: { medium: Memory, sizeLimit: 32Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: deepseek-v4-flash-0731
  namespace: llmops
spec:
  selector:
    app.kubernetes.io/name: deepseek-v4-flash-0731
  ports:
    - name: http
      port: 8000
      targetPort: 8000
