# Kimi-K2.7-Code on one 8x H200 node (specs/004, specs/008).
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: kimi-k2-7-code
  namespace: llmops
  labels:
    app.kubernetes.io/name: kimi-k2-7-code
    app.kubernetes.io/part-of: llmops
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 1
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: kimi-k2-7-code
      spec:
        nodeSelector:
          latere.ai/gpu-pool: h200
        containers:
          - name: runtime
            image: ghcr.io/latere-ai/llmops-runtime-sglang:v0.1.0
            args: ["serve", "--manifest", "/etc/llmops/model.yaml"]
            ports:
              - containerPort: 8000
                name: http
            readinessProbe:
              httpGet: { path: /ready, port: 8000 }
              periodSeconds: 10
              failureThreshold: 180 # cold start can be many minutes
            livenessProbe:
              httpGet: { path: /healthz, port: 8000 }
              periodSeconds: 30
            resources:
              limits:
                nvidia.com/gpu: "8"
            volumeMounts:
              - { name: model-manifest, mountPath: /etc/llmops }
              - { name: cache, mountPath: /cache }
              - { name: shm, mountPath: /dev/shm }
        volumes:
          - name: model-manifest
            configMap: { name: kimi-k2-7-code-manifest }
          - name: cache
            hostPath: { path: /var/cache/llmops, type: DirectoryOrCreate }
          - name: shm
            emptyDir: { medium: Memory, sizeLimit: 32Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: kimi-k2-7-code
  namespace: llmops
spec:
  selector:
    app.kubernetes.io/name: kimi-k2-7-code
  ports:
    - name: http
      port: 8000
      targetPort: 8000
