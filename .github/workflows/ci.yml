name: ci

# The gates this repo runs on every push live in latere-ai/ci (which orders
# them) and latere-ai/ci-gate (which decides what each one asserts). This file
# is the caller.
#
# The pipeline probes the Makefile and runs what it finds, so a gate is turned
# on here by adding a target, not by editing this file. Today that is:
#
#   required   fmt-check, test, lint-modernize
#   optional   test-hermetic, test-race, cover, spec-lint, dist, validate
#
# Every one of those also runs locally, which is the point: three CI failures
# in one day came from tests that depended on what happened to be installed on
# the machine running them, and each passed on a laptop first.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    uses: latere-ai/ci/.github/workflows/go-verify.yml@v1
