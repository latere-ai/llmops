name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: make fmt-check
      - name: Vet + tests + coverage gate (>=90%)
        run: make cover
      - name: Modernize
        run: make lint-modernize
      - name: Validate model manifests
        run: make validate
