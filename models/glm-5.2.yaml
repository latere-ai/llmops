format: fp8
license: mit
runtime: sglang
load: nvme-cache
gpu: { type: h200, count: 8, nodes: 1 }
context_max: 1048576
args:
  - --tp-size=8
  - --ep-size=8
  - --kv-cache-dtype=fp8_e5m2
