# The per-push gate configuration for llmops. The checks themselves live in
# latere.ai/x/ci-gate, pinned in go.mod, so every one of these runs the same
# on a laptop as it does on a runner.

cover:
  # Per package rather than as a repository average. The average passed at
  # 90.4% while internal/harness sat at 85.7% and internal/install at 87.8%.
  threshold: 90.0
  trim_prefix: github.com/latere-ai/llmops/
  exempt: {}

spec:
  # The index drifted: on 2026-08-29 every row read `draft`, including five
  # specs that were built, deployed and serving. It had been hand-edited a
  # dozen times that day.
  dir: specs
  # Three values, and the difference is meant to be legible from the word:
  #   draft    — nothing of it is in the product
  #   partial  — in the product, a named criterion still open
  #   complete — in the product, every criterion holds
  #   archived — the work is over, so the spec lives in .archive/
  status: [draft, partial, complete, archived]
  require: [title, status]
  index: specs/README.md
  wikilinks: true
  # A pipe inside a cell shifts every column after it and nothing else
  # notices: the build passes and the spec renders.
  tables: true
  archive:
    dir: .archive
    statuses: [archived]

hermetic:
  # The system directories, and nothing else. Naming them here is the point:
  # a test that needs a system tool now says so instead of finding one on
  # whatever PATH it happened to inherit.
  allow: [/usr/bin, /bin]

modernize:
  # Off for the reasons recorded in .golangci.yml. lateregate verifies each
  # fixer still exists before passing the flag, because `go fix` rejects an
  # unknown -name=false and this check would then pass silently.
  disable: [newexpr, errorsastype]

depcheck:
  # The CLI's reach is decided here rather than discovered later: one upstream
  # import arrives on the next `go get`, and the first symptom is otherwise a
  # slower build.
  #
  # The OpenTelemetry block below is one decision, not eleven. `llmops serve`
  # sits on the inference path and exports through latere.ai/x/pkg/otel, whose
  # OTLP exporters pull the protobuf, gRPC and retry modules with them. The
  # entries are listed separately so a module that arrives for some other
  # reason still has to be admitted for that reason.
  packages:
    github.com/latere-ai/llmops/cmd/llmops:
      decision: the CLI ships as a single static binary
      allow:
        gopkg.in/yaml.v3: model manifests and deploy artifacts are YAML
        latere.ai/x/pkg: the shared platform packages
        go.opentelemetry.io: the OTLP SDK and HTTP instrumentation behind latere.ai/x/pkg/otel
        google.golang.org: the protobuf and gRPC encoding the OTLP exporters write
        golang.org/x: HTTP/2 and text handling the OTLP exporters reach through
        github.com/cenkalti/backoff/v5: OTLP exporter retry backoff
        github.com/cespare/xxhash/v2: attribute-set hashing in the OTel SDK
        github.com/felixge/httpsnoop: response capture in otelhttp
        github.com/go-logr/logr: the logging interface the OTel SDK reports through
        github.com/go-logr/stdr: the OTel SDK's default logr sink
        github.com/google/uuid: OTLP log record identifiers
        github.com/grpc-ecosystem/grpc-gateway/v2: transitive to the OTLP proto definitions
